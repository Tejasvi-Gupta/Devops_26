server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any route not matching a real file falls back to
    # index.html so React Router (if added later) and direct refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the backend container. The service name "backend"
    # resolves via Docker Compose's internal DNS.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
