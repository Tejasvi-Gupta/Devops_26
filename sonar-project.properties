# SonarCloud project configuration.
# organization/projectKey come from the SonarCloud UI when the project
# was created (Tejasvi-Gupta org, "Devops_26" project).
sonar.organization=tejasvi-gupta
sonar.projectKey=Devops_26

# Scan the whole repo, but skip build artifacts, dependencies, and
# generated files that would otherwise flood results with noise.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/venv/**,**/dist/**,**/__pycache__/**,**/*.pyc,**/alembic/versions/**
